    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header scroll-header" id="header">
        <nav class="nav">
            <div class="nav__logo">
                <h3><a href="index.html" style="color: inherit; text-decoration: none;">Luna</a></h3>
            </div>
            <ul class="nav__menu" id="nav-menu">
                <div class="nav__close" id="nav-close">
                    <i class="fas fa-times"></i>
                </div>
                <li class="nav__item">
                    <a href="index.html" class="nav__link">Home</a>
                </li>
                <li class="nav__item">
                    <a href="about.html" class="nav__link">About</a>
                </li>
                <li class="nav__item">
                    <a href="portfolio.html" class="nav__link active-link">Portfolio</a>
                </li>
                <li class="nav__item">
                    <a href="services.html" class="nav__link">Services</a>
                </li>
                <li class="nav__item">

                </li>
            </ul>
            <div class="nav__toggle" id="nav-toggle">
                <i class="fas fa-bars"></i>

    <section class="portfolio section" id="portfolio" style="padding-top: 8rem;">
        <div class="container">
            <h2 class="section__title">Portfolio</h2>
            <div class="portfolio__grid">
                <div class="portfolio__item">

                </div>
                <div class="portfolio__item">
                    <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&h=600&fit=crop" alt="Landscape Photography" class="portfolio__img">
                </div>
                <div class="portfolio__item">
                    <img src="https://images.unsplash.com/photo-1514315384763-ba401779410f?w=600&h=600&fit=crop" alt="Street Photography" class="portfolio__img">
                </div>
                <div class="portfolio__item">
                    <img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?w=600&h=600&fit=crop" alt="Event Photography" class="portfolio__img">
                </div>
                <div class="portfolio__item">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&h=600&fit=crop" alt="Product Photography" class="portfolio__img">
                </div>
                <div class="portfolio__item">
                    <img src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?w=600&h=600&fit=crop" alt="Architecture Photography" class="portfolio__img">
                </div>
                <div class="portfolio__item">
                    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=600&fit=crop" alt="Nature Photography" class="portfolio__img">
                </div>
                <div class="portfolio__item">
                    <img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=600&h=600&fit=crop" alt="Fashion Photography" class="portfolio__img">
                </div>
                <div class="portfolio__item">
                    <img src="https://images.unsplash.com/photo-1519741497674-611481863552?w=600&h=600&fit=crop" alt="Wedding Photography" class="portfolio__img">
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer__container">
                <h1 class="footer__title">Luna</h1>
                <ul class="footer__social">
                    <a href="https://instagram.com/luna_photo" class="footer__social-link" target="_blank">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a href="https://behance.net/luna" class="footer__social-link" target="_blank">
                        <i class="fab fa-behance"></i>
                    </a>
                    <a href="https://pinterest.com/luna" class="footer__social-link" target="_blank">
                        <i class="fab fa-pinterest"></i>
                    </a>
                </ul>
                <span class="footer__copy">© 2024 Luna. All rights reserved.</span>
            </div>
        </div>
    </footer>

    <a href="#" class="scrollup" id="scroll-up">

    </a>

    <div class="lightbox" id="lightbox">
        <span class="lightbox__close" id="lightbox-close">&times;</span>
        <span class="lightbox__prev" id="lightbox-prev">&#10094;</span>
        <span class="lightbox__next" id="lightbox-next">&#10095;</span>
        <div class="lightbox__content">
            <img src="" alt="Portfolio Image" class="lightbox__img" id="lightbox-img">
